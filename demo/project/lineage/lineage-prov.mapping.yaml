# Data lineage to PROV-O, as a reviewer left it: every decision accepted, except the
# relationship types the AI proposed again (gemini-2.5-flash, three passes), still to review.
format: n20s-mapping/0.1
id: lineage-prov
name: Data lineage LPG to PROV-O
lpgOntology:
  id: Data lineage LPG (PROV-inspired)
  version: "1"
  location: aura-export.json
targets:
  - namespace: http://www.w3.org/ns/prov#
    location: ../targets/prov.nq
strategy: template
prefixes:
  prov: http://www.w3.org/ns/prov#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  lin: https://example.org/lineage/
nodes:
  n:0:
    subject: lin:entity/{p:0}
    classes:
      - prov:Entity
  n:1:
    subject: lin:activity/{p:1}
    classes:
      - prov:Activity
  n:2:
    subject: lin:agent/{p:2}
    classes:
      - prov:Agent
    properties:
      p:3:
        predicate: rdfs:label
  n:3:
    properties:
      p:6:
        predicate: rdfs:label
      p:5:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
      p:7:
        ignore:
          reason: No PROV equivalent.
      p:8:
        ignore:
          reason: No PROV equivalent; a domain vocabulary (DCAT) would type it.
      p:9:
        ignore:
          reason: Retirement of the logical asset is not a PROV invalidation of a version.
  n:4:
    properties:
      p:12:
        predicate: prov:generatedAtTime
        datatype: xsd:dateTime
      p:16:
        predicate: prov:invalidatedAtTime
        datatype: xsd:dateTime
      p:11:
        ignore:
          reason: Opaque source-system version; no PROV equivalent.
      p:13:
        ignore:
          reason: Publication is not a PROV event.
      p:14:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:15:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:17:
        ignore:
          reason: No PROV equivalent.
  n:5:
    properties:
      p:19:
        predicate: rdfs:label
  n:6:
    properties:
      p:21:
        predicate: rdfs:label
      p:22:
        ignore:
          reason: No PROV equivalent.
      p:23:
        ignore:
          reason: No PROV equivalent.
      p:24:
        ignore:
          reason: No PROV equivalent.
  n:7:
    properties:
      p:27:
        predicate: rdfs:label
      p:26:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
  n:8:
    classes:
      - prov:Plan
    properties:
      p:29:
        ignore:
          reason: No PROV equivalent.
      p:30:
        ignore:
          reason: No PROV equivalent.
      p:31:
        ignore:
          reason: No PROV equivalent.
      p:32:
        ignore:
          reason: No PROV equivalent.
  n:9:
    properties:
      p:34:
        predicate: prov:startedAtTime
        datatype: xsd:dateTime
      p:35:
        predicate: prov:endedAtTime
        datatype: xsd:dateTime
      p:36:
        ignore:
          reason: Not PROV. Invalid outputs are exported as invalidations of the versions.
      p:37:
        ignore:
          reason: Ingestion bookkeeping.
      p:38:
        ignore:
          reason: Ingestion bookkeeping.
      p:39:
        ignore:
          reason: Ingestion bookkeeping.
      p:40:
        ignore:
          reason: Execution parameters; may be sensitive and have no PROV equivalent.
      p:41:
        ignore:
          reason: Reference to a secure store; not exported.
  n:10:
    classes:
      - prov:Person
  n:11:
    classes:
      - prov:SoftwareAgent
  n:12:
    classes:
      - prov:Organization
relationships:
  r:0:
    predicate: prov:used
    qualified:
      subject: lin:usage/{start.p:1}/{end.p:0}
      class: prov:Usage
      link: prov:qualifiedUsage
      target: prov:entity
    properties:
      p:48:
        predicate: prov:hadRole
        values:
          input: lin:role/input
          lookup: lin:role/lookup
          config: lin:role/config
        meta:
          proposedBy:
            kind: human
            name: Pierre
          rationale: Role strings become prov:Role individuals; unknown roles are skipped and show up in coverage.
  r:1:
    predicate: prov:wasGeneratedBy
    qualified:
      subject: lin:generation/{start.p:0}
      class: prov:Generation
      link: prov:qualifiedGeneration
      target: prov:activity
    properties:
      p:49:
        predicate: prov:hadRole
        values:
          output: lin:role/output
  r:3:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    properties:
      p:52:
        ignore:
          reason: "prov:hadActivity needs a join from runId to the Run node: a computed row in the scope or a rule."
          deferred: true
      p:53:
        ignore:
          reason: Reachable through the run once prov:hadActivity exists.
          deferred: true
      p:54:
        ignore:
          reason: Evidence metadata; no PROV equivalent.
      p:55:
        ignore:
          reason: Evidence metadata; no PROV equivalent.
      p:56:
        ignore:
          reason: No PROV equivalent.
      p:57:
        ignore:
          reason: No PROV equivalent. IDENTITY is not prov:Quotation, which is about repeating content attributed to an author.
      p:58:
        ignore:
          reason: Descriptive only.
      p:59:
        ignore:
          reason: Time of the assertion, not of the derivation.
  r:4:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:column-derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    properties:
      p:60:
        ignore:
          reason: "prov:hadActivity needs a join from runId to the Run node: a computed row in the scope or a rule."
          deferred: true
      p:61:
        ignore:
          reason: Reachable through the run once prov:hadActivity exists.
          deferred: true
      p:62:
        ignore:
          reason: Evidence metadata; no PROV equivalent.
      p:63:
        ignore:
          reason: Evidence metadata; no PROV equivalent.
      p:64:
        ignore:
          reason: No PROV equivalent.
      p:65:
        ignore:
          reason: No PROV equivalent.
      p:66:
        ignore:
          reason: Descriptive only.
      p:67:
        ignore:
          reason: Time of the assertion, not of the derivation.
  r:5:
    predicate: prov:specializationOf
  r:12:
    predicate: prov:wasInformedBy
  r:13:
    predicate: prov:wasAssociatedWith
    qualified:
      subject: lin:association/{start.p:1}/{end.p:2}
      class: prov:Association
      link: prov:qualifiedAssociation
      target: prov:agent
    properties:
      p:68:
        predicate: prov:hadRole
        values:
          executor: lin:role/executor
          triggeredBy: lin:role/triggeredBy
  r:14:
    predicate: prov:wasAttributedTo
    qualified:
      subject: lin:attribution/{start.p:0}/{end.p:2}
      class: prov:Attribution
      link: prov:qualifiedAttribution
      target: prov:agent
    properties:
      p:69:
        predicate: prov:hadRole
        values:
          owner: lin:role/owner
          steward: lin:role/steward
  r:16:
    predicate: prov:wasInvalidatedBy
    qualified:
      subject: lin:invalidation/{start.p:0}
      class: prov:Invalidation
      link: prov:qualifiedInvalidation
      target: prov:activity
    properties:
      p:70:
        predicate: rdfs:comment
  r:2:
    ignore:
      reason: The 'DEPENDS_ON' relationship represents a potential, over-approximated dependency computed from other relationships, not a proven derivation. Mapping it to 'prov:wasDerivedFrom' would imply a stronger, more direct provenance assertion than the source data intends.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: The 'DEPENDS_ON' relationship represents a potential, over-approximated dependency computed from other relationships, not a proven derivation. Mapping it to 'prov:wasDerivedFrom' would imply a stronger, more direct provenance assertion than the source data intends.
  r:6:
    ignore:
      reason: No suitable predicate in PROV-O for a general 'has part' or 'composition' relationship between two prov:Entity instances. prov:hadMember requires the domain to be prov:Collection, but Dataset is mapped to prov:Entity.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.8
      rationale: PROV-O does not provide a direct predicate for a 'has column' relationship between a generic entity (Dataset) and another entity (Column). While a dataset could be seen as a collection, the Dataset node is currently mapped as a prov:Entity, not a prov:Collection, making prov:hadMember unsuitable.
  r:7:
    predicate: prov:hadMember
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: A DatasetVersion can be considered a prov:Collection of ColumnVersions, which are prov:Entity instances. The prov:hadMember property expresses this collection-member relationship.
  r:8:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: A ColumnVersion is a specific version, and thus a specialization, of a logical Column.
  r:9:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: A JobVersion is a specific instance or definition of a more general Job, which aligns with the meaning of prov:specializationOf.
  r:10:
    ignore:
      reason: The relationship describes an activity instance executing a logical job definition. PROV-O does not have a direct predicate for this relationship between an Activity and an Entity (representing a job definition) that captures the 'executes' or 'instance-of' semantics. Expressing this relationship would likely require a qualified association pattern, possibly involving a re-evaluation of the 'Job' node kind to 'prov:Plan'.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.8
      rationale: The 'RUN_OF' relationship links an activity instance (Run) to its abstract definition (Job). PROV-O's 'prov:hadPlan' predicate, which links an 'Association' to a 'Plan', is the closest concept for activity definitions, but 'Job' is currently mapped as 'prov:Entity' and 'Run' is 'prov:Activity', requiring a more complex qualified pattern.
  r:11:
    ignore:
      reason: The target ontology requires the plan to be associated with a prov:Association (between an activity and an agent), not directly with the prov:Activity. This requires a join with the WAS_ASSOCIATED_WITH relationship.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The PROV-O property prov:hadPlan has prov:Association as its domain, not prov:Activity. To map this, the plan needs to be linked to the qualified association between the Run (Activity) and an Agent.
  r:15:
    predicate: prov:actedOnBehalfOf
    qualified:
      subject: lin:delegation/{start.p:2}/{end.p:2}
      class: prov:Delegation
      link: prov:qualifiedDelegation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The relationship directly corresponds to the prov:actedOnBehalfOf property, which describes an agent acting on behalf of another.
