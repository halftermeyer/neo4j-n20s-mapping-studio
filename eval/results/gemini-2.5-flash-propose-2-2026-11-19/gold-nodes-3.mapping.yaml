format: n20s-mapping/0.1
id: lineage-prov-aura
name: Data lineage LPG to PROV-O
lpgOntology:
  id: Data lineage LPG (PROV-inspired)
  version: "1"
  location: aura-export.json
targets:
  - namespace: http://www.w3.org/ns/prov#
    location: targets/prov.nq
strategy: template
prefixes:
  prov: http://www.w3.org/ns/prov#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  lin: https://example.org/lineage/
nodes:
  n:0:
    subject: lin:entity/{p:0}
    classes:
      - prov:Entity
  n:1:
    subject: lin:activity/{p:1}
    classes:
      - prov:Activity
  n:2:
    subject: lin:agent/{p:2}
    classes:
      - prov:Agent
    properties:
      p:3:
        predicate: rdfs:label
  n:3:
    properties:
      p:6:
        predicate: rdfs:label
      p:5:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
      p:7:
        ignore:
          reason: No PROV equivalent.
      p:8:
        ignore:
          reason: No PROV equivalent; a domain vocabulary (DCAT) would type it.
      p:9:
        ignore:
          reason: Retirement of the logical asset is not a PROV invalidation of a version.
  n:4:
    properties:
      p:12:
        predicate: prov:generatedAtTime
        datatype: xsd:dateTime
      p:16:
        predicate: prov:invalidatedAtTime
        datatype: xsd:dateTime
      p:11:
        ignore:
          reason: Opaque source-system version; no PROV equivalent.
      p:13:
        ignore:
          reason: Publication is not a PROV event.
      p:14:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:15:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:17:
        ignore:
          reason: No PROV equivalent.
  n:5:
    properties:
      p:19:
        predicate: rdfs:label
  n:6:
    properties:
      p:21:
        predicate: rdfs:label
      p:22:
        ignore:
          reason: No PROV equivalent.
      p:23:
        ignore:
          reason: No PROV equivalent.
      p:24:
        ignore:
          reason: No PROV equivalent.
  n:7:
    properties:
      p:27:
        predicate: rdfs:label
      p:26:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
  n:8:
    classes:
      - prov:Plan
    properties:
      p:29:
        ignore:
          reason: No PROV equivalent.
      p:30:
        ignore:
          reason: No PROV equivalent.
      p:31:
        ignore:
          reason: No PROV equivalent.
      p:32:
        ignore:
          reason: No PROV equivalent.
  n:9:
    properties:
      p:34:
        predicate: prov:startedAtTime
        datatype: xsd:dateTime
      p:35:
        predicate: prov:endedAtTime
        datatype: xsd:dateTime
      p:36:
        ignore:
          reason: Not PROV. Invalid outputs are exported as invalidations of the versions.
      p:37:
        ignore:
          reason: Ingestion bookkeeping.
      p:38:
        ignore:
          reason: Ingestion bookkeeping.
      p:39:
        ignore:
          reason: Ingestion bookkeeping.
      p:40:
        ignore:
          reason: Execution parameters; may be sensitive and have no PROV equivalent.
      p:41:
        ignore:
          reason: Reference to a secure store; not exported.
  n:10:
    classes:
      - prov:Person
  n:11:
    classes:
      - prov:SoftwareAgent
  n:12:
    classes:
      - prov:Organization
relationships:
  r:0:
    predicate: prov:used
    qualified:
      subject: lin:usage/{start.p:1}/{end.p:0}
      class: prov:Usage
      link: prov:qualifiedUsage
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The 'USED' relationship directly corresponds to 'prov:used', which links an activity to an entity it used. The qualified form 'prov:Usage' allows for properties like 'role' to be attached.
    properties:
      p:48:
        predicate: prov:hadRole
        values:
          config: lin:role/config
          input: lin:role/input
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 1
          rationale: The 'role' property describes the function of the 'DatasetVersion' in the 'Run', which aligns with 'prov:hadRole' on the 'prov:Usage' instance. The values represent specific roles, so mapping them as IRIs is appropriate.
  r:1:
    predicate: prov:wasGeneratedBy
    qualified:
      subject: lin:generation/{start.p:0}/{end.p:1}
      class: prov:Generation
      link: prov:qualifiedGeneration
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to the PROV-O concept of an entity being generated by an activity.
    properties:
      p:49:
        predicate: prov:hadRole
        values:
          output: lin:role/output
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: The 'role' property describes the function of the generated entity within the activity, which maps well to prov:hadRole on the qualified Generation event.
  r:2:
    ignore:
      reason: The DEPENDS_ON relationship represents a potential, computed over-approximation of a dependency, not a proven derivation. Mapping it to a PROV-O derivation term would be a stronger assertion than the source states.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The DEPENDS_ON relationship represents a potential, computed over-approximation of a dependency, not a proven derivation. Mapping it to a PROV-O derivation term would be a stronger assertion than the source states.
  r:3:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly maps to the PROV-O concept of derivation between entities, with DatasetVersion mapping to prov:Entity.
    properties:
      p:52:
        ignore:
          reason: This property refers to the ID of an activity (Run) that generated the derived dataset version, which needs to be linked to the qualified derivation instance via a pattern.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: The 'runId' identifies the 'Run' (Activity) that generated the derived 'DatasetVersion'. This 'Run' can be linked to the 'prov:Derivation' instance via 'prov:hadActivity' in a pattern.
      p:53:
        ignore:
          reason: This property refers to the ID of a plan (JobVersion) associated with the run that generated the derived dataset version, requiring a pattern to link.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: The 'jobVersionId' identifies the 'JobVersion' (Plan) associated with the 'Run' that generated the derived 'DatasetVersion'. This 'JobVersion' can be linked to the 'Run' (Activity) via 'prov:hadPlan' in a pattern, and then the 'Run' to the 'prov:Derivation' via 'prov:hadActivity'.
      p:54:
        predicate: prov:wasAttributedTo
        values:
          DBT_MANIFEST: lin:source/DBT_MANIFEST
          OPENLINEAGE_COLUMN_LINEAGE: lin:source/OPENLINEAGE_COLUMN_LINEAGE
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: The source of the assertion can be modeled as an agent to which the derivation (as an entity) is attributed.
      p:55:
        ignore:
          reason: No direct PROV-O property exists for a generic evidence reference string on a derivation.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: This is a descriptive reference to external evidence, for which PROV-O does not provide a specific predicate.
      p:56:
        ignore:
          reason: PROV-O does not have a specific property to classify the type of transformation (e.g., DIRECT/INDIRECT) on a derivation.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: The values 'DIRECT' and 'INDIRECT' describe the nature of the transformation, but no suitable PROV-O predicate is available.
      p:57:
        ignore:
          reason: PROV-O does not have a specific property to classify the subtype of transformation (e.g., IDENTITY, AGGREGATION) on a derivation.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: These values provide finer-grained details about the transformation, but no suitable PROV-O predicate is available.
      p:58:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: rdfs:comment is suitable for providing a descriptive string about the transformation expression.
      p:59:
        predicate: prov:generatedAtTime
        datatype: xsd:dateTime
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: The 'prov:Derivation' instance, representing the assertion of derivation, can be considered as being generated at the 'assertedAt' timestamp.
  r:4:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship describes a derivation between two column versions, which are entities. The prov:wasDerivedFrom predicate directly expresses this, and its qualified form prov:Derivation allows for attaching properties to the derivation event.
    properties:
      p:60:
        predicate: prov:hadActivity
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: The 'runId' identifies the Run (an Activity) that generated the derived column version. This Run is directly associated with the prov:Derivation event via prov:hadActivity.
      p:61:
        ignore:
          reason: Requires joining to another node.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: The 'jobVersionId' identifies the JobVersion (a prov:Plan) associated with the Run activity. This requires a join from the prov:Derivation instance to the Run (via prov:hadActivity) and then from the Run to the JobVersion (via prov:hadPlan).
      p:62:
        ignore:
          reason: No target term fits.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: No direct PROV-O predicate exists for the source of the provenance assertion itself, which is metadata about the provenance statement rather than the derived entity.
      p:63:
        ignore:
          reason: No target term fits.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: No direct PROV-O predicate exists for a reference to the evidence supporting the provenance assertion, which is metadata about the provenance statement.
      p:64:
        ignore:
          reason: No target term fits.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: PROV-O does not provide specific predicates for classifying the type of derivation as 'DIRECT' or 'INDIRECT'.
      p:65:
        ignore:
          reason: No target term fits.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: PROV-O does not provide specific predicates for classifying the subtype of derivation like IDENTITY, TRANSFORMATION, AGGREGATION, FILTER, or JOIN.
      p:66:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.7
          rationale: The 'expression' property provides a descriptive string about the transformation, which can be mapped to rdfs:comment on the prov:Derivation instance.
      p:67:
        ignore:
          reason: No target term fits.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: No direct PROV-O predicate exists for the timestamp of when the provenance assertion was recorded, as prov:atTime refers to the time of the event itself.
  r:5:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The `VERSION_OF_DATASET` relationship indicates that a `DatasetVersion` is a specific instance or snapshot of a more general `Dataset`, which aligns with the definition of `prov:specializationOf`.
  r:6:
    predicate: prov:hadMember
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 0.9
      rationale: A Dataset can be considered a prov:Collection of Columns, and prov:hadMember expresses this relationship. Instances of Dataset will implicitly be typed as prov:Collection.
  r:7:
    predicate: prov:hadMember
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 0.9
      rationale: A DatasetVersion can be considered a collection of ColumnVersions, and prov:hadMember expresses the relationship between a collection and its members.
  r:8:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: A ColumnVersion is a specific version, and thus a specialization, of a logical Column.
  r:9:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 0.9
      rationale: A JobVersion is a specific, immutable definition of a logical Job, which aligns with the concept of specialization where the version shares aspects of the logical job but is more specific.
  r:10:
    predicate: prov:wasInfluencedBy
    qualified:
      subject: lin:influence/{start.p:1}/{end.p:0}
      class: prov:Influence
      link: prov:qualifiedInfluence
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 0.7
      rationale: A Run (Activity) is influenced by the Job (Entity) it executes, as the Job defines the Run's purpose and specification. prov:wasInfluencedBy is the most general influence relationship.
  r:11:
    ignore:
      reason: The target ontology requires a qualified relationship (prov:Association) to link an activity to a plan, which is not directly expressed by the source relationship.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The `prov:hadPlan` predicate in PROV-O has `prov:Association` as its domain, not `prov:Activity`. The LPG relationship directly links `Run` (Activity) to `JobVersion` (Plan), which is a shortcut not directly supported by PROV-O's structure.
  r:12:
    predicate: prov:wasInformedBy
    qualified:
      subject: lin:communication/{start.p:1}/{end.p:1}
      class: prov:Communication
      link: prov:activity
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasInformedBy, which describes one activity being informed by another, often through an unspecified entity.
  r:13:
    predicate: prov:wasAssociatedWith
    qualified:
      subject: lin:association/{start.p:1}/{end.p:2}
      class: prov:Association
      link: prov:qualifiedAssociation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasAssociatedWith, which describes an agent's responsibility for an activity. The qualified form prov:Association allows for additional properties.
    properties:
      p:68:
        predicate: prov:hadRole
        values:
          executor: lin:role/executor
          triggeredBy: lin:role/triggeredBy
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 1
          rationale: The 'role' property describes the function of the agent in the association, which directly maps to prov:hadRole on the prov:Association instance.
  r:14:
    predicate: prov:wasAttributedTo
    qualified:
      subject: lin:attribution/{start.p:0}/{end.p:2}
      class: prov:Attribution
      link: prov:qualifiedAttribution
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasAttributedTo, which describes an entity being attributed to an agent. The qualified form prov:Attribution allows for properties of the attribution.
    properties:
      p:69:
        predicate: prov:hadRole
        values:
          owner: lin:role/owner
          steward: lin:role/steward
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 1
          rationale: The 'role' property describes the function of the agent in the attribution, which maps well to prov:hadRole on the prov:Attribution qualified resource.
  r:15:
    predicate: prov:actedOnBehalfOf
    qualified:
      subject: lin:delegation/{start.p:2}/{end.p:2}
      class: prov:Delegation
      link: prov:qualifiedDelegation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to prov:actedOnBehalfOf, which describes an agent acting on behalf of another agent. The qualified form prov:Delegation also fits the description.
  r:16:
    predicate: prov:wasInvalidatedBy
    qualified:
      subject: lin:invalidation/{start.p:0}/{end.p:1}
      class: prov:Invalidation
      link: prov:qualifiedInvalidation
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasInvalidatedBy, linking an entity to the activity that invalidated it.
    properties:
      p:70:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: The 'reason' property provides a descriptive comment about the invalidation event.
