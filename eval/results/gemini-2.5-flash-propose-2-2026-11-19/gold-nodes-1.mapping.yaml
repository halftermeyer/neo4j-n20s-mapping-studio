          owner: lin:role/owner
          steward: lin:role/steward
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.9
          rationale: The 'role' property on the attribution relationship maps to prov:hadRole on the qualified prov:Attribution resource, allowing specific roles to be identified as IRIs.
  r:15:
    predicate: prov:actedOnBehalfOf
