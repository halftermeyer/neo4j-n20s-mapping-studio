      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The ACTED_ON_BEHALF_OF relationship directly corresponds to prov:actedOnBehalfOf, which models an agent acting on behalf of another agent.
  r:16:
    predicate: prov:wasInvalidatedBy
    qualified:
      subject: lin:invalidation/{start.p:0}/{end.p:1}
      class: prov:Invalidation
      link: prov:qualifiedInvalidation
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/2
      confidence: 1
      rationale: The relationship directly corresponds to the PROV-O predicate prov:wasInvalidatedBy, linking an entity (DatasetVersion) to an activity (Run) that invalidated it.
    properties:
      p:70:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/2
          confidence: 0.8
          rationale: The 'reason' property provides a descriptive string for the invalidation, which can be mapped to rdfs:comment on the qualified Invalidation instance.
