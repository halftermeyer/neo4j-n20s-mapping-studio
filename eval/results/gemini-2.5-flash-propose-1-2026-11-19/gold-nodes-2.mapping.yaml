format: n20s-mapping/0.1
id: lineage-prov-aura
name: Data lineage LPG to PROV-O
lpgOntology:
  id: Data lineage LPG (PROV-inspired)
  version: "1"
  location: aura-export.json
targets:
  - namespace: http://www.w3.org/ns/prov#
    location: targets/prov.nq
strategy: template
prefixes:
  prov: http://www.w3.org/ns/prov#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  lin: https://example.org/lineage/
nodes:
  n:0:
    subject: lin:entity/{p:0}
    classes:
      - prov:Entity
  n:1:
    subject: lin:activity/{p:1}
    classes:
      - prov:Activity
  n:2:
    subject: lin:agent/{p:2}
    classes:
      - prov:Agent
    properties:
      p:3:
        predicate: rdfs:label
  n:3:
    properties:
      p:6:
        predicate: rdfs:label
      p:5:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
      p:7:
        ignore:
          reason: No PROV equivalent.
      p:8:
        ignore:
          reason: No PROV equivalent; a domain vocabulary (DCAT) would type it.
      p:9:
        ignore:
          reason: Retirement of the logical asset is not a PROV invalidation of a version.
  n:4:
    properties:
      p:12:
        predicate: prov:generatedAtTime
        datatype: xsd:dateTime
      p:16:
        predicate: prov:invalidatedAtTime
        datatype: xsd:dateTime
      p:11:
        ignore:
          reason: Opaque source-system version; no PROV equivalent.
      p:13:
        ignore:
          reason: Publication is not a PROV event.
      p:14:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:15:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:17:
        ignore:
          reason: No PROV equivalent.
  n:5:
    properties:
      p:19:
        predicate: rdfs:label
  n:6:
    properties:
      p:21:
        predicate: rdfs:label
      p:22:
        ignore:
          reason: No PROV equivalent.
      p:23:
        ignore:
          reason: No PROV equivalent.
      p:24:
        ignore:
          reason: No PROV equivalent.
  n:7:
    properties:
      p:27:
        predicate: rdfs:label
      p:26:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
  n:8:
    classes:
      - prov:Plan
    properties:
      p:29:
        ignore:
          reason: No PROV equivalent.
      p:30:
        ignore:
          reason: No PROV equivalent.
      p:31:
        ignore:
          reason: No PROV equivalent.
      p:32:
        ignore:
          reason: No PROV equivalent.
  n:9:
    properties:
      p:34:
        predicate: prov:startedAtTime
        datatype: xsd:dateTime
      p:35:
        predicate: prov:endedAtTime
        datatype: xsd:dateTime
      p:36:
        ignore:
          reason: Not PROV. Invalid outputs are exported as invalidations of the versions.
      p:37:
        ignore:
          reason: Ingestion bookkeeping.
      p:38:
        ignore:
          reason: Ingestion bookkeeping.
      p:39:
        ignore:
          reason: Ingestion bookkeeping.
      p:40:
        ignore:
          reason: Execution parameters; may be sensitive and have no PROV equivalent.
      p:41:
        ignore:
          reason: Reference to a secure store; not exported.
  n:10:
    classes:
      - prov:Person
  n:11:
    classes:
      - prov:SoftwareAgent
  n:12:
    classes:
      - prov:Organization
relationships:
  r:0:
    predicate: prov:used
    qualified:
      subject: lin:usage/{start.p:1}/{end.p:0}
      class: prov:Usage
      link: prov:qualifiedUsage
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship 'USED' directly corresponds to the PROV-O property prov:used, indicating an activity utilized an entity. The presence of a 'role' property necessitates a qualified mapping.
    properties:
      p:48:
        predicate: prov:hadRole
        values:
          config: lin:role/config
          input: lin:role/input
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'role' property on the 'USED' relationship describes the function of the dataset version in the activity, which maps well to prov:hadRole on the qualified prov:Usage instance. Values like 'input' or 'lookup' represent distinct roles and can be mapped as IRIs.
  r:1:
    predicate: prov:wasGeneratedBy
    qualified:
      subject: lin:generation/{start.p:0}/{end.p:1}
      class: prov:Generation
      link: prov:qualifiedGeneration
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to an entity being generated by an activity in PROV-O, using its qualified form for richer description.
    properties:
      p:49:
        predicate: prov:hadRole
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 1
          rationale: The 'role' property describes the role of the generated entity within the generation event, which maps directly to prov:hadRole on the qualified prov:Generation instance.
  r:2:
    ignore:
      reason: The relationship represents a potential dependency and an over-approximation, not a proven derivation, which is a stronger assertion than what prov:wasDerivedFrom implies.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The source explicitly states that DEPENDS_ON is 'not a proven derivation' and an 'over-approximation'. Mapping it to prov:wasDerivedFrom would imply a stronger, proven derivation, which contradicts the source's definition.
  r:3:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasDerivedFrom, and its properties necessitate the use of a qualified form (prov:Derivation) to capture additional details.
    properties:
      p:52:
        predicate: prov:hadActivity
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'runId' identifies the activity (Run) that performed the derivation, which can be linked to the prov:Derivation instance via prov:hadActivity.
      p:53:
        ignore:
          reason: The job version is a plan associated with the run (activity) that performed the derivation. This can be expressed by traversing from the prov:Derivation to its prov:hadActivity (the Run), and then from the Run to its prov:hadPlan (the JobVersion).
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: The 'jobVersionId' refers to a JobVersion, which is a Plan. While relevant, it's indirectly linked through the Run activity, making it a deferred mapping.
      p:54:
        ignore:
          reason: This describes the source of the provenance assertion itself, which is typically handled by named graphs or reification in RDF, not a direct property of the prov:Derivation instance.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: The 'source' property describes the origin of the assertion, which is metadata about the provenance statement rather than a property of the derivation event itself.
      p:55:
        ignore:
          reason: This describes external evidence for the provenance assertion, which is typically handled by named graphs or reification in RDF, not a direct property of the prov:Derivation instance.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: The 'evidenceRef' provides a reference to external evidence, which is metadata about the provenance assertion and not a direct property of the derivation event.
      p:56:
        ignore:
          reason: No direct PROV-O property exists to classify the specific type of derivation (e.g., DIRECT, INDIRECT). rdfs:comment is too generic.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: PROV-O does not provide specific properties for classifying the 'transformationType' of a derivation, and a generic comment would lose semantic precision.
      p:57:
        ignore:
          reason: No direct PROV-O property exists to classify the specific subtype of derivation (e.g., IDENTITY, AGGREGATION). rdfs:comment is too generic.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: PROV-O lacks specific properties for detailed 'transformationSubtype' classifications, making a direct mapping difficult without losing semantic value.
      p:58:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'expression' provides a descriptive string about the transformation, which can be captured using rdfs:comment.
      p:59:
        ignore:
          reason: This describes when the provenance assertion was recorded, which is metadata about the assertion itself, not a property of the prov:Derivation instance.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: The 'assertedAt' timestamp refers to when the provenance assertion was made, which is metadata about the statement rather than a property of the derivation event.
  r:4:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship describes a derivation between two column versions, which are mapped to prov:Entity. prov:wasDerivedFrom is the direct predicate for entity derivations.
    properties:
      p:60:
        predicate: prov:hadActivity
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The run is the activity responsible for the derivation, and prov:hadActivity links a derivation to its associated activity.
      p:61:
        ignore:
          reason: The job version is a plan associated with the run (activity) that caused the derivation, requiring a pattern (Derivation -> hadActivity -> Run -> hadPlan -> JobVersion).
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property refers to a JobVersion (Plan) associated with the Run (Activity) that caused the derivation, which requires a multi-step mapping pattern.
      p:62:
        ignore:
          reason: No direct equivalent in PROV-O for the source of the provenance assertion itself.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: This property describes the source of the lineage assertion, which is metadata about the provenance statement rather than the provenance event itself.
      p:63:
        ignore:
          reason: No direct equivalent in PROV-O for a reference to the evidence of the provenance assertion.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: This property provides a reference to the evidence for the lineage assertion, which is metadata about the provenance statement.
      p:64:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: This property provides a descriptive classification of the derivation, which can be captured as a comment on the prov:Derivation instance.
      p:65:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: This property provides a finer descriptive classification of the derivation, which can be captured as a comment on the prov:Derivation instance.
      p:66:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: This property provides a descriptive expression of the transformation, which can be captured as a comment on the prov:Derivation instance.
      p:67:
        ignore:
          reason: No direct equivalent in PROV-O for the timestamp of when the provenance assertion was recorded.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: This property indicates when the lineage assertion was recorded, not when the derivation event itself occurred, making it metadata about the assertion.
  r:5:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A DatasetVersion is a specific instance or snapshot of a logical Dataset, fitting the definition of prov:specializationOf where the specialized entity (version) shares aspects of the general entity (dataset).
  r:6:
    predicate: prov:hadMember
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A Dataset can be considered a collection of Columns, and prov:hadMember links a collection to its members. This implies that Dataset should also be classified as prov:Collection.
  r:7:
    predicate: prov:hadMember
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A DatasetVersion can be considered a prov:Collection of its ColumnVersions, which are prov:Entity instances. The prov:hadMember property expresses this containment.
  r:8:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: A ColumnVersion is a specific version, and thus a specialization, of a logical Column.
  r:9:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A JobVersion is a specific definition or instance of a logical Job, fitting the definition of prov:specializationOf where one entity is a more specific aspect of another.
  r:10:
    predicate: prov:wasInfluencedBy
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.7
      rationale: The logical job (entity) defines the execution (activity), thereby influencing its character and behavior. prov:wasInfluencedBy is the most general predicate for such a relationship.
  r:11:
    ignore:
      reason: The prov:hadPlan property is defined on prov:Association, which links an activity and an agent. This relationship directly links an activity to a plan, without an explicit agent or association.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: The LPG relationship (Run)-[:HAD_PLAN]->(JobVersion) directly connects an Activity to a Plan. In PROV-O, prov:hadPlan is a property of prov:Association, which itself links an Activity and an Agent. Therefore, this mapping requires a join with the WAS_ASSOCIATED_WITH relationship to form the prov:Association instance.
  r:12:
    predicate: prov:wasInformedBy
    qualified:
      subject: lin:communication/{start.p:1}/{end.p:1}
      class: prov:Communication
      link: prov:qualifiedCommunication
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasInformedBy, which describes one activity being informed by another, often through an unspecified entity.
  r:13:
    predicate: prov:wasAssociatedWith
    qualified:
      subject: lin:association/{start.p:1}/{end.p:2}
      class: prov:Association
      link: prov:qualifiedAssociation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to prov:wasAssociatedWith, indicating an agent's responsibility for an activity. The qualified form allows for attaching properties like 'role'.
    properties:
      p:68:
        predicate: prov:hadRole
        values:
          executor: lin:role/executor
          triggeredBy: lin:role/triggeredBy
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 1
          rationale: The 'role' property on the association maps directly to prov:hadRole, with the string values representing specific roles as IRIs.
  r:14:
    predicate: prov:wasAttributedTo
    qualified:
      subject: lin:attribution/{start.p:0}/{end.p:2}
      class: prov:Attribution
      link: prov:entity
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The WAS_ATTRIBUTED_TO relationship directly corresponds to prov:wasAttributedTo, linking an entity to an agent responsible for it.
    properties:
      p:69:
        predicate: prov:hadRole
        values:
          owner: lin:role/owner
          steward: lin:role/steward
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'role' property on the relationship describes the specific role of the agent in the attribution, which maps to prov:hadRole on the prov:Attribution instance. The string values can be converted to IRIs representing prov:Role instances.
  r:15:
    predicate: prov:actedOnBehalfOf
    qualified:
      subject: lin:delegation/{start.p:2}/{end.p:2}
      class: prov:Delegation
      link: prov:qualifiedDelegation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to the PROV-O property prov:actedOnBehalfOf, which describes an agent acting on behalf of another.
  r:16:
    predicate: prov:wasInvalidatedBy
    qualified:
      subject: lin:invalidation/{start.p:0}/{end.p:1}
      class: prov:Invalidation
      link: prov:qualifiedInvalidation
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to the PROV-O predicate prov:wasInvalidatedBy, which describes an entity being invalidated by an activity. The qualified form is used as per PROV-O best practices.
    properties:
      p:70:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'reason' property provides a textual explanation for the invalidation, which can be mapped to rdfs:comment on the prov:Invalidation instance.
