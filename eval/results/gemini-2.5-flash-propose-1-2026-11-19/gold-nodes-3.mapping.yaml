format: n20s-mapping/0.1
id: lineage-prov-aura
name: Data lineage LPG to PROV-O
lpgOntology:
  id: Data lineage LPG (PROV-inspired)
  version: "1"
  location: aura-export.json
targets:
  - namespace: http://www.w3.org/ns/prov#
    location: targets/prov.nq
strategy: template
prefixes:
  prov: http://www.w3.org/ns/prov#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  lin: https://example.org/lineage/
nodes:
  n:0:
    subject: lin:entity/{p:0}
    classes:
      - prov:Entity
  n:1:
    subject: lin:activity/{p:1}
    classes:
      - prov:Activity
  n:2:
    subject: lin:agent/{p:2}
    classes:
      - prov:Agent
    properties:
      p:3:
        predicate: rdfs:label
  n:3:
    properties:
      p:6:
        predicate: rdfs:label
      p:5:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
      p:7:
        ignore:
          reason: No PROV equivalent.
      p:8:
        ignore:
          reason: No PROV equivalent; a domain vocabulary (DCAT) would type it.
      p:9:
        ignore:
          reason: Retirement of the logical asset is not a PROV invalidation of a version.
  n:4:
    properties:
      p:12:
        predicate: prov:generatedAtTime
        datatype: xsd:dateTime
      p:16:
        predicate: prov:invalidatedAtTime
        datatype: xsd:dateTime
      p:11:
        ignore:
          reason: Opaque source-system version; no PROV equivalent.
      p:13:
        ignore:
          reason: Publication is not a PROV event.
      p:14:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:15:
        ignore:
          reason: Point-in-time validity is not PROV; it stays in the LPG (query 36).
      p:17:
        ignore:
          reason: No PROV equivalent.
  n:5:
    properties:
      p:19:
        predicate: rdfs:label
  n:6:
    properties:
      p:21:
        predicate: rdfs:label
      p:22:
        ignore:
          reason: No PROV equivalent.
      p:23:
        ignore:
          reason: No PROV equivalent.
      p:24:
        ignore:
          reason: No PROV equivalent.
  n:7:
    properties:
      p:27:
        predicate: rdfs:label
      p:26:
        ignore:
          reason: Part of the OpenLineage identity, already encoded in the id.
  n:8:
    classes:
      - prov:Plan
    properties:
      p:29:
        ignore:
          reason: No PROV equivalent.
      p:30:
        ignore:
          reason: No PROV equivalent.
      p:31:
        ignore:
          reason: No PROV equivalent.
      p:32:
        ignore:
          reason: No PROV equivalent.
  n:9:
    properties:
      p:34:
        predicate: prov:startedAtTime
        datatype: xsd:dateTime
      p:35:
        predicate: prov:endedAtTime
        datatype: xsd:dateTime
      p:36:
        ignore:
          reason: Not PROV. Invalid outputs are exported as invalidations of the versions.
      p:37:
        ignore:
          reason: Ingestion bookkeeping.
      p:38:
        ignore:
          reason: Ingestion bookkeeping.
      p:39:
        ignore:
          reason: Ingestion bookkeeping.
      p:40:
        ignore:
          reason: Execution parameters; may be sensitive and have no PROV equivalent.
      p:41:
        ignore:
          reason: Reference to a secure store; not exported.
  n:10:
    classes:
      - prov:Person
  n:11:
    classes:
      - prov:SoftwareAgent
  n:12:
    classes:
      - prov:Organization
relationships:
  r:0:
    predicate: prov:used
    qualified:
      subject: lin:usage/{start.p:1}/{end.p:0}
      class: prov:Usage
      link: prov:qualifiedUsage
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship 'USED' directly corresponds to the PROV-O property prov:used, indicating an activity utilized an entity. The presence of a 'role' property necessitates a qualified mapping.
    properties:
      p:48:
        predicate: prov:hadRole
        values:
          config: lin:role/config
          input: lin:role/input
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'role' property on the 'USED' relationship describes the function of the dataset version in the activity, which maps well to prov:hadRole on the qualified prov:Usage instance. Values like 'input' or 'lookup' represent distinct roles and can be mapped as IRIs.
  r:1:
    predicate: prov:wasGeneratedBy
    qualified:
      subject: lin:generation/{start.p:0}/{end.p:1}
      class: prov:Generation
      link: prov:qualifiedGeneration
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to an entity being generated by an activity in PROV-O, using its qualified form for richer description.
    properties:
      p:49:
        predicate: prov:hadRole
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 1
          rationale: The 'role' property describes the role of the generated entity within the generation event, which maps directly to prov:hadRole on the qualified prov:Generation instance.
  r:3:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to the PROV-O 'wasDerivedFrom' predicate, and its properties can be attached to the qualified 'Derivation' instance.
    properties:
      p:52:
        ignore:
          reason: This property identifies the Run (Activity) that performed the derivation. It should be mapped as a link from the prov:Derivation instance to the Run via prov:hadActivity.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'runId' is an identifier for the activity that performed the derivation, not a literal property of the derivation event itself. It requires linking to the corresponding Run node.
      p:53:
        ignore:
          reason: This property identifies the JobVersion (Plan) associated with the Run. It should be mapped as a link from the Run (identified by runId) to the JobVersion via prov:hadPlan.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'jobVersionId' is an identifier for the plan associated with the activity, not a literal property of the derivation event. It requires linking to the corresponding JobVersion node.
      p:54:
        ignore:
          reason: No direct PROV-O predicate exists for the source of a provenance assertion as a literal property of the derivation event.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property describes the source of the assertion itself, which is metadata about the provenance statement rather than a characteristic of the derivation event in PROV-O.
      p:55:
        ignore:
          reason: No direct PROV-O predicate exists for a reference to the evidence of a provenance assertion as a literal property of the derivation event.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property provides a reference to the evidence for the assertion, which is metadata about the provenance statement rather than a characteristic of the derivation event in PROV-O.
      p:56:
        ignore:
          reason: PROV-O does not provide specific predicates for classifying the type of transformation (e.g., DIRECT, INDIRECT) as a literal property of a derivation event.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property describes a specific classification of the derivation, which is not directly supported by PROV-O's core properties for derivation events.
      p:57:
        ignore:
          reason: PROV-O does not provide specific predicates for classifying the subtype of transformation (e.g., IDENTITY, AGGREGATION) as a literal property of a derivation event.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property describes a finer classification of the derivation, which is not directly supported by PROV-O's core properties for derivation events.
      p:58:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'expression' property provides a descriptive text about the transformation, which aligns well with the purpose of rdfs:comment.
      p:59:
        ignore:
          reason: PROV-O focuses on the time of the provenance event itself (e.g., generation, usage), not the time when the provenance assertion was recorded.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property indicates when the assertion was recorded, which is metadata about the provenance statement, not the timestamp of the derivation event itself.
  r:4:
    predicate: prov:wasDerivedFrom
    qualified:
      subject: lin:derivation/{start.p:0}/{end.p:0}
      class: prov:Derivation
      link: prov:qualifiedDerivation
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship explicitly states 'derivation' between two column versions, which are entities. prov:wasDerivedFrom is the direct predicate for this, with prov:Derivation as its qualified form.
    properties:
      p:60:
        ignore:
          reason: This property identifies the Run (Activity) that generated the target ColumnVersion. The prov:Derivation instance can be linked to this Activity via prov:hadActivity, which requires a join/pattern.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'runId' refers to an Activity that performed the derivation, which can be linked to the qualified Derivation instance using prov:hadActivity, requiring a join.
      p:61:
        ignore:
          reason: This property identifies the JobVersion (Plan) associated with the Run (Activity) that performed the derivation. This requires a join/pattern to link the Derivation to the Run, and then the Run to the JobVersion.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'jobVersionId' refers to a Plan associated with the Activity that performed the derivation, requiring a multi-step join.
      p:62:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: This property provides a descriptive string about the origin of the assertion, which can be captured as a comment on the derivation event.
      p:63:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.7
          rationale: This property provides a descriptive string referencing external evidence for the assertion, which can be captured as a comment on the derivation event.
      p:64:
        ignore:
          reason: There is no specific PROV-O predicate to describe the 'transformationType' or 'kind of dependency' for a derivation.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: PROV-O does not offer a specific predicate to classify the type of transformation within a derivation.
      p:65:
        ignore:
          reason: There is no specific PROV-O predicate to describe the 'transformationSubtype' or finer kind of dependency for a derivation.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: PROV-O does not offer a specific predicate to classify the subtype of transformation within a derivation.
      p:66:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: This property provides a descriptive string of the transformation applied, which can be captured as a comment on the derivation event.
      p:67:
        ignore:
          reason: This property describes when the assertion itself was recorded, not when the derivation event occurred. PROV-O does not have a direct property for this on a derivation instance.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.8
          rationale: The 'assertedAt' timestamp refers to the metadata of the assertion, not the derivation event itself, and no direct PROV-O property fits.
  r:5:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: A DatasetVersion is a specific version, hence a specialization, of a logical Dataset. The prov:specializationOf property correctly captures this relationship between two entities.
  r:6:
    ignore:
      reason: PROV-O does not provide a general 'has part' or 'has component' predicate for arbitrary prov:Entity instances. The relationship describes a static structural composition, which is outside the primary scope of PROV-O.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: The HAS_COLUMN relationship describes a structural composition between a Dataset and a Column, both mapped to prov:Entity. PROV-O lacks a general property for 'has part' or 'has component' for prov:Entity, with prov:hadMember being specific to prov:Collection.
  r:7:
    predicate: prov:hadMember
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A DatasetVersion can be semantically understood as a collection of ColumnVersions, making prov:hadMember an appropriate predicate. The use of prov:hadMember will implicitly type DatasetVersion as a prov:Collection.
  r:8:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: A ColumnVersion is a specific version, and thus a specialization, of a logical Column.
  r:9:
    predicate: prov:specializationOf
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A JobVersion is a specific, immutable version of a logical Job, fitting the definition of specialization.
  r:10:
    predicate: prov:used
    qualified:
      subject: lin:usage/{start.p:1}/{end.p:0}
      class: prov:Usage
      link: prov:qualifiedUsage
      target: prov:entity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 0.9
      rationale: A Run (activity) executes a Job (logical job definition, entity). This can be interpreted as the Run "using" the Job definition as a blueprint or specification for its execution.
  r:11:
    ignore:
      reason: The prov:hadPlan property in PROV-O has prov:Association as its domain, not prov:Activity. This relationship needs to be expressed as part of a qualified association between the Run (Activity) and an Agent.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The LPG's HAD_PLAN directly links an Activity to a Plan. In PROV-O, a plan is associated with an Activity through an intermediate prov:Association resource, which also links to an Agent. Therefore, this mapping requires a more complex pattern involving the WAS_ASSOCIATED_WITH relationship.
  r:12:
    predicate: prov:wasInformedBy
    qualified:
      subject: lin:communication/{start.p:1}/{end.p:1}
      class: prov:Communication
      link: prov:qualifiedCommunication
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly corresponds to the prov:wasInformedBy property, which describes one activity being informed by another.
  r:13:
    predicate: prov:wasAssociatedWith
    qualified:
      subject: lin:association/{start.p:1}/{end.p:2}
      class: prov:Association
      link: prov:qualifiedAssociation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The prov:wasAssociatedWith predicate directly expresses an agent's responsibility for an activity, matching the relationship's meaning. The qualified form prov:Association allows for attaching additional properties like role.
    properties:
      p:68:
        predicate: prov:hadRole
        values:
          executor: lin:role/executor
          triggeredBy: lin:role/triggeredBy
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 1
          rationale: The prov:hadRole predicate is designed to link an Association (the qualified form of WAS_ASSOCIATED_WITH) to a Role. The string values can be mapped to IRIs representing instances of prov:Role.
  r:14:
    predicate: prov:wasAttributedTo
    qualified:
      subject: lin:attribution/{start.p:0}/{end.p:2}
      class: prov:Attribution
      link: prov:qualifiedAttribution
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The WAS_ATTRIBUTED_TO relationship directly corresponds to prov:wasAttributedTo, which describes an entity being attributed to an agent. The presence of a 'role' property makes the qualified form suitable.
    properties:
      p:69:
        predicate: prov:hadRole
        values:
          owner: lin:role/owner
          steward: lin:role/steward
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'role' property on the WAS_ATTRIBUTED_TO relationship directly maps to prov:hadRole on the prov:Attribution instance, specifying the function of the agent in this attribution. The values are likely to be specific roles that can be represented as IRIs.
  r:15:
    predicate: prov:actedOnBehalfOf
    qualified:
      subject: lin:delegation/{start.p:2}/{end.p:2}
      class: prov:Delegation
      link: prov:qualifiedDelegation
      target: prov:agent
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The relationship directly maps to prov:actedOnBehalfOf, which has a qualified form prov:Delegation to express the delegation of responsibility.
  r:16:
    predicate: prov:wasInvalidatedBy
    qualified:
      subject: lin:invalidation/{start.p:0}/{end.p:1}
      class: prov:Invalidation
      link: prov:qualifiedInvalidation
      target: prov:activity
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/1
      confidence: 1
      rationale: The prov:wasInvalidatedBy predicate directly expresses that an entity was invalidated by an activity, matching the source relationship. The qualified form prov:Invalidation allows for attaching properties to the invalidation event.
    properties:
      p:70:
        predicate: rdfs:comment
        datatype: xsd:string
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/1
          confidence: 0.9
          rationale: The 'reason' property provides a textual explanation for the invalidation, which aligns with the purpose of rdfs:comment on the prov:Invalidation instance.
