format: n20s-mapping/0.1
id: sensors-sosa
name: Plant telemetry to SOSA
lpgOntology:
  id: Plant telemetry
  version: "1"
  location: aura-export.json
targets:
  - namespace: http://www.w3.org/ns/sosa/
    location: targets/sosa.ttl
strategy: template
prefixes:
  sosa: http://www.w3.org/ns/sosa/
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  pl: https://plant.example.org/id/
nodes:
  n:0:
    subject: pl:rig/{p:0}
    classes:
      - sosa:Platform
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: "A drilling rig acts as a platform that hosts various equipment, including gauges (sensors). (Subject: From the uniqueness of rigId on Rig.)"
    properties:
      p:1:
        predicate: rdfs:label
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.95
          rationale: The 'name' property directly corresponds to a human-readable label for the rig.
      p:2:
        ignore:
          reason: No suitable predicate in the target ontology to represent a commissioning date for a platform.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.85
          rationale: The catalog does not provide a specific property for the commissioning date of a platform.
  n:1:
    subject: pl:gauge/{p:3}
    classes:
      - sosa:Sensor
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Gauge is a device that measures, fitting the definition of a SOSA Sensor. (Subject: From the uniqueness of tag on Gauge.)"
    properties:
      p:4:
        ignore:
          reason: No suitable predicate in the target ontology for a device model.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The target ontology does not provide a specific predicate for the model of a sensor.
      p:5:
        ignore:
          reason: No suitable predicate in the target ontology for a device serial number.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The target ontology does not provide a specific predicate for the serial number of a sensor.
  n:2:
    subject: pl:metric/{p:6}
    classes:
      - sosa:ObservableProperty
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Metric represents a characteristic or quality that a Gauge (Sensor) observes, directly aligning with sosa:ObservableProperty. (Subject: From the uniqueness of code on Metric.)"
    properties:
      p:7:
        predicate: rdfs:label
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'label' property provides a human-readable name for the Metric, which directly maps to rdfs:label.
      p:8:
        ignore:
          reason: No direct equivalent property in the target ontology for the unit of an ObservableProperty.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The target ontology does not provide a direct property to describe the unit of an ObservableProperty.
  n:3:
    subject: pl:tick/{p:9}
    classes:
      - sosa:Observation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A 'Tick' represents a single reading from a gauge, which directly corresponds to the definition of an 'Observation' in SOSA. (Subject: From the uniqueness of tickId on Tick.)"
    properties:
      p:10:
        predicate: sosa:hasSimpleResult
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'value' property holds the actual reading, which is the simple result of the observation.
      p:11:
        predicate: sosa:resultTime
        datatype: xsd:dateTime
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'measuredAt' property indicates when the observation was completed, directly mapping to 'resultTime'.
      p:12:
        ignore:
          reason: No direct equivalent property in SOSA for the quality of an observation result.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.7
          rationale: The 'quality' property describes the reliability of the reading, but there is no specific SOSA property for this metadata on an Observation or its simple result.
  n:4:
    subject: pl:rollup/{p:13}
    classes:
      - sosa:Observation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Rollup represents a calculated average of observations over a time window, which aligns with the definition of sosa:Observation as an act of calculating a value of a property. (Subject: From the uniqueness of rollupId on Rollup.)"
    properties:
      p:14:
        predicate: sosa:hasSimpleResult
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'mean' property provides the calculated value of the rollup, directly corresponding to the simple result of an observation.
      p:15:
        ignore:
          reason: The 'windowStart' property defines one boundary of a time interval, which needs to be combined with 'windowEnd' to form a sosa:phenomenonTime interval resource.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: This property defines the start of the time window for the rollup, which is part of the sosa:phenomenonTime interval and requires a composite mapping.
      p:16:
        ignore:
          reason: The 'windowEnd' property defines one boundary of a time interval, which needs to be combined with 'windowStart' to form a sosa:phenomenonTime interval resource.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: This property defines the end of the time window for the rollup, which is part of the sosa:phenomenonTime interval and requires a composite mapping.
  n:5:
    subject: pl:method/{p:17}
    classes:
      - sosa:Procedure
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Method represents a computational procedure used in data processing, which aligns with the definition of sosa:Procedure. (Subject: From the uniqueness of name on Method.)"
    properties:
      p:18:
        ignore:
          reason: No suitable predicate in the target ontology to represent a 'version' of a procedure.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The 'version' property is a specific attribute of the method that does not have a direct equivalent in the SOSA ontology.
  n:6:
    ignore:
      reason: The SOSA ontology does not provide a direct class for representing an alarm limit or threshold as a distinct entity.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: The SOSA ontology does not provide a direct class for representing an alarm limit or threshold as a distinct entity.
  n:7:
    subject: pl:work-order/{p:22}
    classes:
      - sosa:Actuation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.6
      rationale: "A WorkOrder describes an instance of work performed to change the state of a Rig, which aligns with the concept of an Actuation in SOSA. (Subject: From the uniqueness of woNumber on WorkOrder.)"
    properties:
      p:23:
        ignore:
          reason: sosa:phenomenonTime is an object property for a temporal entity (e.g., an interval). The 'opened' property represents the start of this interval, which needs to be combined with 'closed' to form a temporal interval.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.8
          rationale: The 'opened' property marks the beginning of the work order's activity, which would form part of a temporal interval for the actuation.
      p:24:
        predicate: sosa:resultTime
        datatype: xsd:dateTime
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The 'closed' timestamp directly corresponds to the completion time of the work order, aligning with sosa:resultTime for an Actuation.
      p:25:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The 'summary' provides a human-readable description of the work order, which fits the purpose of rdfs:comment.
  n:8:
    subject: pl:crew/{p:26}
    classes:
      - sosa:Actuator
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: "A Crew performs maintenance work (Actuation) and thus acts as an Actuator. (Subject: From the uniqueness of crewId on Crew.)"
    properties:
      p:27:
        predicate: rdfs:label
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'name' property provides a human-readable label for the Crew.
relationships:
  r:0:
    predicate: sosa:isHostedBy
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'BOLTED_TO' relationship indicates that a Gauge (Sensor) is installed on a Rig (Platform), which directly corresponds to the meaning of 'sosa:isHostedBy'.
  r:1:
    predicate: sosa:madeObservation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'EMITS' relationship from a Gauge (Sensor) to a Tick (Observation) directly corresponds to a Sensor making an Observation.
  r:2:
    predicate: sosa:observedProperty
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'ABOUT' relationship from a Tick (Observation) to a Metric (ObservableProperty) directly corresponds to sosa:observedProperty, which links an Observation to the property that was observed.
  r:3:
    predicate: sosa:hasFeatureOfInterest
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: The 'ON' relationship indicates that the Rig is the FeatureOfInterest for the Tick (Observation).
  r:4:
    predicate: sosa:observes
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'TRACKS' relationship describes what a Gauge (Sensor) is configured to read, which directly aligns with a Sensor observing an ObservableProperty.
  r:5:
    ignore:
      reason: No suitable predicate in the target ontology to express that one observation is an aggregation of other observations.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: The SOSA ontology does not provide a direct predicate to link an aggregated observation (Rollup) to the individual observations (Ticks) it comprises.
  r:6:
    predicate: sosa:observedProperty
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'ABOUT' relationship from a Rollup (Observation) to a Metric (ObservableProperty) directly corresponds to sosa:observedProperty.
  r:7:
    predicate: sosa:usedProcedure
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'COMPUTED_WITH' relationship indicates that a Rollup (Observation) utilized a Method (Procedure), which directly aligns with the meaning of sosa:usedProcedure.
  r:8:
    ignore:
      reason: The target node 'Threshold' has been ignored, so this relationship cannot be mapped.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'Threshold' node kind was previously ignored, making it impossible to map relationships involving it.
  r:9:
    predicate: sosa:hasFeatureOfInterest
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: A WorkOrder (Actuation) is performed on a Rig (Platform), making the Rig the FeatureOfInterest for that Actuation.
  r:10:
    predicate: sosa:madeByActuator
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The relationship links an Actuation (WorkOrder) to the Actuator (Crew) that performed it, which directly corresponds to sosa:madeByActuator.
  r:11:
    ignore:
      reason: SOSA does not provide specific predicates to model the lifecycle or replacement events between sosa:Sensor instances.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: SOSA does not provide specific predicates to model the lifecycle or replacement events between sosa:Sensor instances.
