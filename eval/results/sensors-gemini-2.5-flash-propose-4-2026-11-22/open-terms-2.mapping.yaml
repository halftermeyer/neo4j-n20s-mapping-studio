format: n20s-mapping/0.1
id: sensors-sosa
name: Plant telemetry to SOSA
lpgOntology:
  id: Plant telemetry
  version: "1"
  location: aura-export.json
targets:
  - namespace: http://www.w3.org/ns/sosa/
    location: targets/sosa.ttl
strategy: template
prefixes:
  sosa: http://www.w3.org/ns/sosa/
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  pl: https://plant.example.org/id/
nodes:
  n:0:
    subject: pl:rig/{p:0}
    classes:
      - sosa:Platform
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A drilling rig acts as a host for gauges (sensors) and is the subject of maintenance work, fitting the definition of a SOSA Platform. (Subject: From the uniqueness of rigId on Rig.)"
    properties:
      p:1:
        predicate: rdfs:label
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: rdfs:label is the standard predicate for a human-readable name.
      p:2:
        ignore:
          reason: No suitable predicate in the target ontology to represent a commissioning date for a Platform.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The available date/time properties in SOSA are specific to observations, actuations, or sampling events, not for the lifecycle of a Platform itself.
  n:1:
    subject: pl:gauge/{p:3}
    classes:
      - sosa:Sensor
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Gauge is a device that measures, which aligns with the definition of a sosa:Sensor. (Subject: From the uniqueness of tag on Gauge.)"
    properties:
      p:4:
        ignore:
          reason: No suitable predicate in the target ontology for a device model.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The target ontology lacks a specific property for the model of a sensor.
      p:5:
        ignore:
          reason: No suitable predicate in the target ontology for a device serial number.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The target ontology lacks a specific property for the serial number of a sensor.
  n:2:
    subject: pl:metric/{p:6}
    classes:
      - sosa:ObservableProperty
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Metric represents a characteristic or quality that a Gauge (Sensor) observes, directly aligning with sosa:ObservableProperty. (Subject: From the uniqueness of code on Metric.)"
    properties:
      p:7:
        predicate: rdfs:label
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'label' property provides a human-readable name for the Metric, which directly maps to rdfs:label.
      p:8:
        ignore:
          reason: No direct equivalent property in the target ontology for the unit of an ObservableProperty.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The target ontology does not provide a direct property to describe the unit of an ObservableProperty.
  n:3:
    subject: pl:tick/{p:9}
    classes:
      - sosa:Observation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A 'Tick' represents a single reading from a gauge, which directly corresponds to the definition of an 'Observation' in SOSA. (Subject: From the uniqueness of tickId on Tick.)"
    properties:
      p:10:
        predicate: sosa:hasSimpleResult
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'value' property holds the actual reading, which is the simple result of the observation.
      p:11:
        predicate: sosa:resultTime
        datatype: xsd:dateTime
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'measuredAt' property indicates when the observation was completed, directly mapping to 'resultTime'.
      p:12:
        ignore:
          reason: No direct equivalent property in SOSA for the quality of an observation result.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.7
          rationale: The 'quality' property describes the reliability of the reading, but there is no specific SOSA property for this metadata on an Observation or its simple result.
  n:4:
    subject: pl:rollup/{p:13}
    classes:
      - sosa:Observation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: "A Rollup represents a calculated observation (an average) over a specific time window, fitting the definition of sosa:Observation. (Subject: From the uniqueness of rollupId on Rollup.)"
    properties:
      p:14:
        predicate: sosa:hasSimpleResult
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.95
          rationale: The 'mean' property represents the primary result value of this aggregated observation.
      p:15:
        ignore:
          reason: This property, along with 'windowEnd', defines a time interval that should be represented as a sosa:phenomenonTime resource, which cannot be directly mapped from two literal properties in this schema.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The 'windowStart' property is part of a time interval for the observation, which requires a complex mapping to a temporal entity resource via sosa:phenomenonTime.
      p:16:
        ignore:
          reason: This property, along with 'windowStart', defines a time interval that should be represented as a sosa:phenomenonTime resource, which cannot be directly mapped from two literal properties in this schema.
          deferred: true
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The 'windowEnd' property is part of a time interval for the observation, which requires a complex mapping to a temporal entity resource via sosa:phenomenonTime.
  n:5:
    subject: pl:method/{p:17}
    classes:
      - sosa:Procedure
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: "A Method represents a computational procedure used in data processing, which aligns with the definition of sosa:Procedure. (Subject: From the uniqueness of name on Method.)"
    properties:
      p:18:
        ignore:
          reason: No suitable predicate in the target ontology to represent a 'version' of a procedure.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.9
          rationale: The 'version' property is a specific attribute of the method that does not have a direct equivalent in the SOSA ontology.
  n:6:
    ignore:
      reason: A Threshold defines a limit for an ObservableProperty (Metric) and is tripped by an Observation (Tick). Its meaning is best expressed in conjunction with these related elements, potentially as a property of an ObservableProperty or within a more complex pattern, rather than a standalone class in SOSA.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: A Threshold defines a limit for an ObservableProperty (Metric) and is tripped by an Observation (Tick). Its meaning is best expressed in conjunction with these related elements, potentially as a property of an ObservableProperty or within a more complex pattern, rather than a standalone class in SOSA.
  n:7:
    subject: pl:work-order/{p:22}
    classes:
      - sosa:Actuation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: "A WorkOrder describes an activity that changes the state of the world (e.g., maintenance on a rig), aligning with the definition of sosa:Actuation. (Subject: From the uniqueness of woNumber on WorkOrder.)"
    properties:
      p:23:
        ignore:
          reason: No direct equivalent in SOSA for the creation/opening time of an Actuation; it is administrative metadata.
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.7
          rationale: The 'opened' property represents the creation or opening time of the work order, which is not directly covered by SOSA's Actuation properties like resultTime or phenomenonTime.
      p:24:
        predicate: sosa:resultTime
        datatype: xsd:dateTime
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.95
          rationale: The 'closed' property directly corresponds to the completion time of the WorkOrder activity, which is an Actuation.
      p:25:
        predicate: rdfs:comment
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 0.95
          rationale: The 'summary' provides a human-readable description of the WorkOrder, which aligns with rdfs:comment.
  n:8:
    subject: pl:crew/{p:26}
    classes:
      - sosa:Actuator
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: "A Crew performs maintenance work, which is modeled as an Actuation. Therefore, a Crew acts as an Actuator in the SOSA ontology. (Subject: From the uniqueness of crewId on Crew.)"
    properties:
      p:27:
        predicate: rdfs:label
        meta:
          status: proposed
          proposedBy:
            kind: ai
            model: gemini-2.5-flash
            promptVersion: propose/4
          confidence: 1
          rationale: The 'name' property provides a human-readable identifier for the Crew, which directly maps to rdfs:label.
relationships:
  r:0:
    predicate: sosa:isHostedBy
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: A Gauge (Sensor) is installed on a Rig (Platform), which aligns with the meaning of a sensor being hosted by a platform.
  r:1:
    predicate: sosa:madeObservation
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The relationship EMITS from Gauge (Sensor) to Tick (Observation) directly corresponds to sosa:madeObservation, which links a Sensor to an Observation it made.
  r:2:
    predicate: sosa:observedProperty
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'ABOUT' relationship from a Tick (Observation) to a Metric (ObservableProperty) directly corresponds to an Observation being about a specific observed property.
  r:3:
    ignore:
      reason: The information that a Tick (Observation) is on a Rig (Platform) is implicitly represented by the fact that the Tick is made by a Gauge (Sensor) which is hosted by the Rig.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: "The relationship is derivable from existing mappings: (Tick)-[:EMITS]->(Gauge) maps to sosa:madeObservation, and (Gauge)-[:BOLTED_TO]->(Rig) maps to sosa:isHostedBy."
  r:4:
    predicate: sosa:observes
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'TRACKS' relationship from Gauge (Sensor) to Metric (ObservableProperty) directly corresponds to a Sensor observing an ObservableProperty.
  r:5:
    ignore:
      reason: SOSA does not provide a direct predicate to express that one observation is an aggregation or rollup of other observations.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.8
      rationale: The relationship describes a data processing step where one observation is derived from others, which is not directly modeled in SOSA.
  r:6:
    predicate: sosa:observedProperty
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The 'ABOUT' relationship from a Rollup (Observation) to a Metric (ObservableProperty) directly corresponds to sosa:observedProperty, which links an Observation to the property it observed.
  r:7:
    predicate: sosa:usedProcedure
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The relationship indicates that a Rollup (an Observation) was computed using a specific Method (a Procedure). sosa:usedProcedure links an Observation to the Procedure used.
  r:8:
    ignore:
      reason: The 'Threshold' node kind is currently deferred, and this relationship expresses a condition that may require a more complex pattern involving the threshold's definition.
      deferred: true
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.8
      rationale: The relationship 'TRIPPED' links an observation to a threshold, which is not directly supported by a simple predicate in SOSA and depends on how 'Threshold' is eventually modeled.
  r:9:
    predicate: sosa:hasFeatureOfInterest
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: The WorkOrder (Actuation) is performed on or for the Rig (Platform), making the Rig the FeatureOfInterest for that Actuation.
  r:10:
    predicate: sosa:madeByActuator
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 1
      rationale: The relationship links an Actuation (WorkOrder) to the Actuator (Crew) that performed it, which directly corresponds to sosa:madeByActuator.
  r:11:
    ignore:
      reason: The SOSA ontology does not provide a direct predicate to express a 'replaced by' relationship between two sensors, which is a lifecycle event not explicitly covered by SOSA's core concepts of observation, actuation, or sampling.
    meta:
      status: proposed
      proposedBy:
        kind: ai
        model: gemini-2.5-flash
        promptVersion: propose/4
      confidence: 0.9
      rationale: The SOSA ontology does not provide a direct predicate to express a 'replaced by' relationship between two sensors, which is a lifecycle event not explicitly covered by SOSA's core concepts of observation, actuation, or sampling.
